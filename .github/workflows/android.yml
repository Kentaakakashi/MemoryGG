name: Build MemoryGG rootless agent test APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both APKs
        run: gradle --no-daemon assembleDebug

      - name: Validate controller JNI exports
        shell: bash
        run: |
          set -euo pipefail
          NM="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          CONTROLLER="app/build/outputs/apk/debug/app-debug.apk"
          HOST="agenthost/build/outputs/apk/debug/agenthost-debug.apk"
          test -f "$CONTROLLER"
          test -f "$HOST"
          unzip -p "$CONTROLLER" "lib/arm64-v8a/libmemorygg.so" > "$RUNNER_TEMP/controller.so"
          unzip -p "$HOST" "lib/arm64-v8a/libmemorygg.so" > "$RUNNER_TEMP/agenthost.so"
          "$NM" -D "$RUNNER_TEMP/controller.so" > "$RUNNER_TEMP/controller-symbols.txt"
          "$NM" -D "$RUNNER_TEMP/agenthost.so" > "$RUNNER_TEMP/agenthost-symbols.txt"
          grep -q "Java_com_kentaakakashi_memorygg_MainActivity_nativeSelfTest" "$RUNNER_TEMP/controller-symbols.txt"
          grep -q "Java_com_kentaakakashi_memorygg_MainActivity_nativeScanFirst" "$RUNNER_TEMP/controller-symbols.txt"
          grep -q "Java_com_kentaakakashi_memorygg_agenthost_AgentHostService_nativeScanFirst" "$RUNNER_TEMP/agenthost-symbols.txt"
          grep -q "Java_com_kentaakakashi_memorygg_agenthost_AgentHostService_nativeWriteValue" "$RUNNER_TEMP/agenthost-symbols.txt"
          grep -q "Java_com_kentaakakashi_memorygg_agenthost_AgentHostActivity_nativeGetTestValue" "$RUNNER_TEMP/agenthost-symbols.txt"
          echo "Controller and target-agent JNI entry points are present."

      - name: Validate rootless target integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:name=".AgentHostService"' agenthost/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' agenthost/src/main/AndroidManifest.xml
          grep -q 'override fun authorize(token: String)' agenthost/src/main/java/com/kentaakakashi/memorygg/agenthost/AgentHostService.kt
          grep -q 'MessageDigest.isEqual' agenthost/src/main/java/com/kentaakakashi/memorygg/agenthost/AgentHostService.kt
          grep -q 'nativeScanFirst' agenthost/src/main/cpp/agent-host-jni.cpp
          grep -q 'nativeWriteValue' agenthost/src/main/cpp/agent-host-jni.cpp
          grep -q 'Rootless game integration' README.md
          test -f docs/ROOTLESS_APK_INTEGRATION.md
          echo "Rootless in-process target contract checks passed."

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MemoryGG-controller-debug.apk
          cp agenthost/build/outputs/apk/debug/agenthost-debug.apk dist/MemoryGG-agent-host-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGG-rootless-test-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
