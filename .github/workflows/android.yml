name: Build MemoryGG diagnostic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Validate packaged scanner JNI
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" "lib/arm64-v8a/libmemorygg.so" > "$RUNNER_TEMP/libmemorygg.so"
          NM="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D "$RUNNER_TEMP/libmemorygg.so" > "$RUNNER_TEMP/native-symbols.txt"
          for symbol in nativeSelfTest nativeGetTestValue nativeSetTestValue nativeScanFirst nativeScanNext nativeWriteValue nativeClearScan; do
            grep -q "Java_com_kentaakakashi_memorygg_MainActivity_${symbol}" "$RUNNER_TEMP/native-symbols.txt"
            echo "Verified JNI export: $symbol"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGG-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
