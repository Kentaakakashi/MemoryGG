plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kentaakakashi.memorygg.agenthost'
    compileSdk 35
    ndkVersion '27.0.12077973'

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.kentaakakashi.memorygg.agenthost'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
